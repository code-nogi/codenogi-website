<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 150" role="img" >
  <defs>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b4b4" stop-opacity="0.48"></stop>
      <stop offset="50%" stop-color="#00b4b4" stop-opacity="0.018"></stop>
      <stop offset="100%" stop-color="#00b4b4" stop-opacity="0.48"></stop>
    </linearGradient>
    <filter id="frost" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch" result="n"></feTurbulence>
      <feColorMatrix in="n" type="saturate" values="3" result="g"></feColorMatrix>
      <feComponentTransfer in="g"><feFuncA type="linear" slope="0.11" intercept="0.11"></feFuncA></feComponentTransfer>
    </filter>
  </defs>

	  <rect x="0" y="0" width="1500" height="150" fill="#00b4b4" fill-opacity="0.3"></rect>
  <rect x="0" y="0" width="1500" height="150" fill="url(#glassSheen)"></rect>
  <rect x="0" y="0" width="1500" height="150" filter="url(#frost)" style="mix-blend-mode:screen;opacity:1"></rect>


</svg>